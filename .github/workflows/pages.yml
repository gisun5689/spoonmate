name: Build, verify and publish SpoonMate authorization

on:
  push:
    branches: [main]
    paths:
      - config/users.json
      - authorization-public-key.pem
      - index.html
      - scripts/build-authorization.mjs
      - scripts/verify-authorization.mjs
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: spoonmate-authorization-pages
  cancel-in-progress: false

jobs:
  build-verify-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build signed authorization envelope
        env:
          AUTHORIZATION_ED25519_PRIVATE_KEY_BASE64: ${{ secrets.AUTHORIZATION_ED25519_PRIVATE_KEY_BASE64 }}
          AUTHORIZATION_REVISION: ${{ github.run_number }}
        run: node scripts/build-authorization.mjs config/users.json authorization-public-key.pem _site/authorization-envelope.json
      - name: Verify Ed25519 signature and authorization schema
        run: node scripts/verify-authorization.mjs _site/authorization-envelope.json authorization-public-key.pem
      - name: Prepare public artifact
        run: install -m 0644 index.html authorization-public-key.pem _site/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload verified public artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
