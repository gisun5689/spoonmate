name: SpoonMate isolated NSIS upgrade E2E
on:
  workflow_dispatch:
    inputs:
      approved_commit:
        description: Root-reviewed immutable QA commit (40 hex)
        required: true
        type: string
      manifest_sha256:
        description: Root-reviewed artifact-manifest SHA-256 (64 hex)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: spoonmate-isolated-installer-e2e
  cancel-in-progress: false
jobs:
  nsis-e2e:
    if: github.repository == 'gisun5689/spoonmate'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: ci-qa
          sparse-checkout-cone-mode: true
      - name: Real NSIS install, locked old uninstall, retry, data preservation
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPOONMATE_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          APPROVED_COMMIT: ${{ inputs.approved_commit }}
          APPROVED_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: |
          & ./ci-qa/Invoke-InstallerE2E.ps1 -ManifestPath ./ci-qa/artifact-manifest.json -ExpectedManifestSha256 $env:APPROVED_MANIFEST_SHA256 -ExpectedCommit $env:APPROVED_COMMIT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload sanitized fixture proof only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spoonmate-nsis-e2e-${{ github.run_id }}
          path: ${{ runner.temp }}/spoonmate-nsis-e2e-*/proofs/*.json
          if-no-files-found: error
          retention-days: 7

